# Project Root Compose: EventEase Frontend
# Usage:
#   docker compose -f docker-compose.frontend.yml up --build
# Open:
#   http://localhost:3000

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://eventease-backend-qkbl.onrender.com}
    image: eventease-frontend:latest
    container_name: eventease-frontend
    ports:
      - "${PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://eventease-backend-qkbl.onrender.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
