# Local and containerized execution for EventEase Frontend
# Usage:
#   1. Run production container:
#        docker compose up --build
#      Open http://localhost:3000
#
#   2. Run development container with hot-reload:
#        docker compose --profile dev up --build frontend-dev
#      Open http://localhost:5173

services:
  # Production SPA container served via Nginx on port 3000
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://eventease-backend-qkbl.onrender.com}
    image: eventease-frontend:latest
    container_name: eventease-frontend
    ports:
      - "${PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://eventease-backend-qkbl.onrender.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional development container with volume mount for live reloading
  frontend-dev:
    image: node:20-alpine
    container_name: eventease-frontend-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://eventease-backend-qkbl.onrender.com}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    profiles:
      - dev
