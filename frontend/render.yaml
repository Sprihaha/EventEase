# Render Blueprint Specification for EventEase Frontend Static Site
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: eventease-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://eventease-backend-qkbl.onrender.com
      - key: VITE_TICKETMASTER_API_KEY
        sync: false
