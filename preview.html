
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EventEase Feature Wordmarks</title>

  <!-- Bold font similar to the EventEase logo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --eventease-purple: #32134F;
      --eventease-vibrant: #7438E8;
      --eventease-orange: #FF6500;
      --eventease-pink: #D83DA5;
      --eventease-background: #FFFAF6;
    }

    body {
      margin: 0;
      padding: 40px 24px;
      background: var(--eventease-background);
      font-family: Arial, sans-serif;
    }

    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
    }

    .feature-name {
      color: var(--eventease-purple);
      font-family: "Archivo", sans-serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1.2;
    }
  </style>
</head>

<body>
  <div class="feature-list">
    <div class="feature-name">EventEase</div>
    <div class="feature-name">EaseComms</div>
    <div class="feature-name">EasePix</div>
    <div class="feature-name">EaseXplore</div>
    <div class="feature-name">EaseXchange</div>
    <div class="feature-name">EaseVoice</div>
    <div class="feature-name">EaseGuide</div>
    <div class="feature-name">EaseAnalytics</div>
  </div>
</body>
</html>
