# Full-Stack Docker Compose for EventEase (PostgreSQL + Monolith App)
# Usage:
#   docker compose up --build
#
# Services:
#   - Database: PostgreSQL 17 on port 5432
#   - App:      EventEase Monolith (React SPA + FastAPI) on http://localhost:10000

services:
  db:
    image: postgres:17-alpine
    container_name: eventease-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventease}
      POSTGRES_USER: ${POSTGRES_USER:-eventease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventease} -d ${POSTGRES_DB:-eventease}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventease-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-eventease}
      DB_USER: ${POSTGRES_USER:-eventease}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_SSLMODE: disable
      DB_SCHEMA: public
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_at_least_32_characters_long_for_security}
      ADMIN_USERNAME: system_admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-eeAdmin2!}
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:10000}
      CORS_ORIGINS: http://localhost:10000,http://localhost:5173
      PAYMENT_PROVIDER: mock
      EVENTFINDA_USERNAME: ${EVENTFINDA_USERNAME:-}
      EVENTFINDA_PASSWORD: ${EVENTFINDA_PASSWORD:-}
      SALES_CLOSE_DAYS_BEFORE_EVENT: ${SALES_CLOSE_DAYS_BEFORE_EVENT:-7}
      DATA_GOV_SG_API_KEY: ${DATA_GOV_SG_API_KEY:-}
      # Gmail sending: put MAIL_TRANSPORT=smtp and SMTP_PASSWORD=<app password> in project/.env (git-ignored).
      # Without them, emails are printed to the container log instead.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "10000:10000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
