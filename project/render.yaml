# Render Blueprint: EventEase Monolith
# Docs: https://render.com/docs/blueprint-spec
#
# One container serves everything:
#   Nginx (port 10000) → React SPA at /
#                      → proxy /api/* and /health to Uvicorn (127.0.0.1:8000)
#
# The separate backend/render.yaml and frontend/render.yaml are kept intact
# as a fallback; only this root file is used by the Render Blueprint.

services:
  - type: web
    name: eventease
    runtime: docker
    plan: free
    rootDir: project
    dockerfilePath: Dockerfile
    dockerContext: .
    # Render health-check hits this path on the public port (10000 → Nginx → Uvicorn)
    healthCheckPath: /health

    envVars:
      # ── App ─────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      # ── Database (set these in the Render dashboard) ─────────────────
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: eventease_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: DB_SCHEMA
        value: public

      # ── Auth ─────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: eventeaseadmin
      # Set ADMIN_PASSWORD in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false

      # ── CORS — same-origin monolith: loosen only for the onrender.com host ──
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://([a-z0-9-]+\.)*onrender\.com
      # FRONTEND_URL = the same service URL (used by backend for email links etc.)
      - key: FRONTEND_URL
        sync: false

      # ── External APIs ────────────────────────────────────────────────
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock

      # ── Mail (SendGrid works on Render free — no outbound SMTP block) ──
      - key: MAIL_TRANSPORT
        value: sendgrid
      - key: MAIL_FROM
        value: "EventEase <admin.gendol@gmail.com>"
      - key: SENDGRID_API_KEY
        sync: false
      # Resend / SMTP kept as optional fallbacks; set in dashboard if needed
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
