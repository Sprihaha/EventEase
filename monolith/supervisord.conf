[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
username=eventease
password=eventease_internal_secret

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username=eventease
password=eventease_internal_secret

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ── Nginx — serves React SPA and proxies /api/* to Uvicorn ──────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ── Uvicorn — FastAPI application ────────────────────────────────────────
; Render injects PORT but we hardcode 8000 for the internal Uvicorn port
; (Nginx binds 10000 externally; PORT is irrelevant for the internal socket).
[program:uvicorn]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=*
directory=/app/backend
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
