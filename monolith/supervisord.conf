[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ── Nginx — serves React SPA and proxies /api/* to Uvicorn ──────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ── Uvicorn — FastAPI application ────────────────────────────────────────
; Render injects PORT but we hardcode 8000 for the internal Uvicorn port
; (Nginx binds 10000 externally; PORT is irrelevant for the internal socket).
[program:uvicorn]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=*
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
; Run as the non-root eventease user.
; HOME must point to that user's home so psycopg2/SSL cert lookup doesn't
; try /root/.postgresql/ (permission denied when running as eventease).
user=eventease
environment=HOME="/home/eventease"

